name: 20004 Edition CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (MySQL)
        working-directory: apps/server
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Build server
        run: pnpm --filter server build

      - name: Build web
        run: pnpm --filter web build

      - name: Build deploy Docker image (SQLite)
        run: docker build --target app-sqlite -t wewe-rss-20004-ci .
